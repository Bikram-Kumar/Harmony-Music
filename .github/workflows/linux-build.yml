name: Flutter Linux Build (DEB & AppImage)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Linux Release, DEB, and AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev libmediainfo-dev


      - name: Fix compatibility
        run: |
          sed -i 's/ionicons: \^0\.2\.2/ionicons: ^0.2.3/' pubspec.yaml

          sed -i 's/Ionicons\.logo_youtube/Icons.ondemand_video/g' \
            lib/ui/widgets/songinfo_bottom_sheet.dart

          sed -i 's/Ionicons\.play_circle/Icons.play_circle_outline/g' \
            lib/ui/widgets/songinfo_bottom_sheet.dart

      - name: Configure compiler
        run: |
          echo "CXXFLAGS=-Wno-error=unused-but-set-variable" >> "$GITHUB_ENV"
          echo "CFLAGS=-Wno-error=unused-but-set-variable" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Build Debian Package (.deb)
        run: |
          # ⚠️ Replace these with your actual app details
          APP_NAME="HarmonyMusic"
          APP_EXEC="harmonymusic" # This is the binary name generated by Flutter (matches your pubspec.yaml name)
          APP_VERSION="1.14.0"
          ARCH="amd64"
          DEB_DIR="build/debian/${APP_NAME}_${APP_VERSION}_${ARCH}"
          
          # 1. Create directory structure
          mkdir -p $DEB_DIR/usr/local/bin
          mkdir -p $DEB_DIR/opt/$APP_NAME
          mkdir -p $DEB_DIR/usr/share/applications
          mkdir -p $DEB_DIR/DEBIAN
          
          # 2. Copy the Flutter release bundle
          cp -R build/linux/x64/release/bundle/* $DEB_DIR/opt/$APP_NAME/
          
          # 3. Create a symlink so the app can be run via CLI
          ln -s /opt/$APP_NAME/$APP_EXEC $DEB_DIR/usr/local/bin/$APP_NAME
          
          # 4. Create the DEBIAN control file
          cat <<EOF > $DEB_DIR/DEBIAN/control
          Package: ${APP_NAME}
          Version: ${APP_VERSION}
          Section: custom
          Priority: optional
          Architecture: ${ARCH}
          Essential: no
          Installed-Size: 1024
          Maintainer: Your Name <your.email@example.com>
          Description: ${APP_NAME} Flutter application
          EOF
          
          # 5. Create a .desktop file for the Linux app launcher
          cat <<EOF > $DEB_DIR/usr/share/applications/${APP_NAME}.desktop
          [Desktop Entry]
          Version=1.0
          Name=${APP_NAME}
          GenericName=${APP_NAME}
          Exec=/opt/${APP_NAME}/${APP_EXEC}
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # 6. Build the .deb package
          dpkg-deb --build $DEB_DIR

      - name: Build AppImage
        run: |
          # ⚠️ Replace these with your actual app details
          APP_NAME="harmonymusic"
          APP_EXEC="harmonymusic"
          APPDIR="AppDir"
          
          # 1. Create AppDir structure
          mkdir -p $APPDIR/usr/bin
          mkdir -p $APPDIR/usr/share/applications
          mkdir -p $APPDIR/usr/share/icons/hicolor/256x256/apps
          
          # 2. Copy the Flutter release bundle
          cp -R build/linux/x64/release/bundle/* $APPDIR/usr/bin/
          
          # 3. Create AppRun script (the entry point for the AppImage)
          cat <<EOF > $APPDIR/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export LD_LIBRARY_PATH="\${HERE}/usr/lib:\${LD_LIBRARY_PATH}"
          exec "\${HERE}/usr/bin/${APP_EXEC}" "\$@"
          EOF
          chmod +x $APPDIR/AppRun
          
          # 4. Create .desktop file
          cat <<EOF > $APPDIR/${APP_NAME}.desktop
          [Desktop Entry]
          Version=1.0
          Name=${APP_NAME}
          Exec=${APP_EXEC}
          Icon=${APP_NAME}
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF
          
          # 5. Add an icon (AppImageKit will fail if no icon is present)
          cp assets/icons/icon.png $APPDIR/${APP_NAME}.png
          
          # 6. Download appimagetool
          wget "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          
          # 7. Run appimagetool (using extract-and-run because GitHub runner lacks FUSE support)
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run $APPDIR ${APP_NAME}-x86_64.AppImage

      # - name: Upload Build Artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: linux-packages
      #     path: |
      #       build/debian/*.deb
      #       *.AppImage

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Music-Linux
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Music-DEB
          path: build/debian/*.deb
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Music-AppImage
          path: |
            *.AppImage
          if-no-files-found: error